<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тасриф 2.0</title>
<meta name="description" content="Тасриф 2.0 — курс арабской морфологии по учебнику «التصريف»: цели уроков, ввод форм с проверкой харакатов, обратная связь и повторение внутри уроков.">
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FFFFFF'/%3E%3Ccircle cx='5.5' cy='12' r='3' fill='%23AA4C08'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%231C7741'/%3E%3Ccircle cx='18.5' cy='12' r='3' fill='%236243C8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS: тетрадь — нейтральная бумага, чернила, жёлтый маркер ============ */
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --surface-2:#ECECE7; --ink:#1F2328; --muted:#5B626B; --line:#DADAD3; --line-strong:#8E949B;
  --accent:#2F3E5C; --accent-ink:#FFFFFF; --accent-soft:#E4E8F0; --gold:#6F5400; --gold-soft:#FFF1B8;
  --r1:#AA4C08; --r2:#1C7741; --r3:#6243C8; --r4:#B02B77;
  --ok:#1B6F52; --ok-soft:#DDF2E8; --bad:#B8352C; --bad-soft:#FBE4E1;
  --seg-on:#FFFFFF; --shadow:0 2px 10px -4px rgba(20,24,40,.18);
  --font-ui:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-d:'Geologica','Onest',system-ui,sans-serif;
  --font-ar:'Noto Naskh Arabic','Scheherazade New','Geeza Pro','Traditional Arabic',serif;
  --font-ard:'Noto Naskh Arabic','Scheherazade New','Geeza Pro','Traditional Arabic',serif;
  --ar-scale:1; --top-h:58px; --steps-h:46px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16181C; --surface:#1E2126; --surface-2:#282C33; --ink:#E9EAEC; --muted:#A0A6AF; --line:#353A43; --line-strong:#6C737E;
    --accent:#AEBFE6; --accent-ink:#14171C; --accent-soft:#252D40; --gold:#F0D36A; --gold-soft:#3A3212;
    --r1:#F59E54; --r2:#63CE8F; --r3:#B1A2FF; --r4:#F27EBF;
    --ok:#5FD0A6; --ok-soft:#13302A; --bad:#F47B71; --bad-soft:#351B19;
    --seg-on:#3B414B; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16181C; --surface:#1E2126; --surface-2:#282C33; --ink:#E9EAEC; --muted:#A0A6AF; --line:#353A43; --line-strong:#6C737E;
  --accent:#AEBFE6; --accent-ink:#14171C; --accent-soft:#252D40; --gold:#F0D36A; --gold-soft:#3A3212;
  --r1:#F59E54; --r2:#63CE8F; --r3:#B1A2FF; --r4:#F27EBF;
  --ok:#5FD0A6; --ok-soft:#13302A; --bad:#F47B71; --bad-soft:#351B19;
  --seg-on:#3B414B; --shadow:none;
}

/* ============ BASE ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.app{max-width:620px;margin-inline:auto;padding-inline:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.app.focus{padding-bottom:48px}
.view{animation:rise .35s ease both;display:grid;gap:16px}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.w{font-family:var(--font-ar);unicode-bidi:isolate}
/* высота строки с арабской вставкой растёт, чтобы харакаты соседних строк не наезжали друг на друга */
.inl{font-size:1.3em;line-height:1.6;vertical-align:-.06em;padding-inline:.08em}
.nw{white-space:nowrap}
.ar{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate}
.r1{color:var(--r1)} .r2{color:var(--r2)} .r3{color:var(--r3)} .r4{color:var(--r4)}
.star{width:22px;height:22px;color:var(--gold);flex:none}

/* ============ TOP BAR ============ */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:var(--top-h);
  margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px)}
.brand{display:flex;align-items:center;gap:9px;font:700 24px/1 var(--font-d);letter-spacing:.01em}
.brand .ar{font:700 20px/1 var(--font-ard);color:var(--gold);margin-left:2px}
.hd-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.hd-t b{font:600 15px var(--font-ui)}
.hd-t small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:21px;height:21px}
.push{margin-left:auto}

/* ============ FLOATING NAV ============ */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;gap:4px;padding:5px;border-radius:999px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 10px 30px -14px rgba(20,18,12,.35)}
.nav button{display:flex;align-items:center;gap:7px;min-height:42px;padding-inline:16px 18px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 14px var(--font-ui)}
.nav button svg{width:19px;height:19px}
.nav button.on{background:var(--ink);color:var(--bg)}

/* ============ COMMON ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding-inline:22px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:600 15.5px var(--font-ui);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.lbl{font:600 11px var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);line-height:1.55}
.h1{font:700 34px/1.1 var(--font-d);letter-spacing:-.005em;margin-top:8px}
.h2{display:flex;align-items:center;gap:10px;font:700 25px/1.2 var(--font-d);margin-top:14px}
.h2::before{content:"";flex:none;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.h2.plain::before{display:none}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:12px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding-inline:8px;border:0;background:transparent;border-radius:9px;font:500 14px var(--font-ui);color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;transform:rotate(45deg)}
.c1{background:var(--r1)} .c2{background:var(--r2)} .c3{background:var(--r3)} .c0{background:var(--ink)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;padding-block:2px}
.hscroll::-webkit-scrollbar{display:none}
.pt .hscroll{flex-wrap:wrap;justify-content:center;overflow:visible;margin-inline:0;padding-inline:0}
.tag-x{display:inline-block;font:600 10.5px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:6px;padding:4px 6px}
.rule-g{display:flex;align-items:center;gap:12px;color:var(--gold)}
.rule-g::before,.rule-g::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--gold) 45%,transparent)}
.rule-g svg{width:16px;height:16px}

/* ============ HOME ============ */
.mast{display:grid;justify-items:center;text-align:center;gap:4px;padding:18px 0 4px}
.mast .ar{font:700 calc(2.9rem*var(--ar-scale))/1.35 var(--font-ard);color:var(--ink)}
.mast p{color:var(--muted);font-size:14.5px;max-width:34ch}
.resume{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;width:100%;text-align:left;
  padding:20px;border-radius:22px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.resume::after{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:17px;pointer-events:none}
.medal{position:relative;width:86px;height:86px;display:grid;place-items:center;color:var(--gold)}
.medal svg{position:absolute;inset:0;width:100%;height:100%}
.medal b{position:relative;font:700 calc(2.1rem*var(--ar-scale))/1 var(--font-ard);color:var(--accent);padding-top:6px}
.resume .tx{display:grid;gap:3px;min-width:0}
.resume .lbl{color:var(--gold)}
.resume .t-ar{font:700 calc(1.35rem*var(--ar-scale))/1.55 var(--font-ard);direction:rtl;text-align:right}
.resume .t-ru{font-size:15px;color:var(--muted);line-height:1.35}
.resume .go{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;grid-column:1/-1;padding-top:14px;border-top:1px solid var(--line)}
.resume .go span{font:600 15px var(--font-ui);color:var(--accent);display:flex;align-items:center;gap:6px}
.resume .go svg{width:18px;height:18px}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--line);background:transparent}
.pips i.on{background:var(--gold);border-color:var(--gold)}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.sec-row .h2{margin:0}
.thread{position:relative;display:grid}
.thread::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:1px;background:linear-gradient(var(--gold),color-mix(in srgb,var(--gold) 20%,transparent))}
.li{position:relative;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:10px 0;border:0;background:none;text-align:left;width:100%;color:inherit}
.li .node{position:relative;width:40px;height:40px;display:grid;place-items:center}
.li .node svg{position:absolute;inset:7px;width:26px;height:26px;color:var(--gold)}
.li .node svg .fill{fill:var(--bg)}
.li.done .node svg .fill{fill:var(--gold)}
.li.cur .node svg .fill{fill:var(--accent)}
.li.cur .node svg{color:var(--accent)}
.li .node b{position:relative;font:600 11.5px var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.li.done .node b{color:var(--bg)}
.li.cur .node b{color:var(--accent-ink)}
.li .tx{display:grid;min-width:0;gap:0}
.li .tx b{font-weight:500;font-size:15.5px}
.li .tx .w{font-size:calc(1.05rem*var(--ar-scale));color:var(--muted);line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.li .st{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.li .st.ok{color:var(--gold)}
.li:not(.soon):hover .tx b{color:var(--accent)}
.li.soon{cursor:default;color:var(--muted)}
.li.soon .tx b{font-size:14px}

/* ============ LESSON ============ */
.steps{position:sticky;top:var(--top-h);z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  margin-inline:-16px;padding:0 10px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px 1px;overflow:hidden;border:0;border-radius:11px;background:none;font:500 12px var(--font-ui);color:var(--muted);white-space:nowrap;min-width:0}
.stp i{width:7px;height:7px;transform:rotate(45deg);border:1.5px solid currentColor;opacity:.6}
.stp.seen i{background:var(--gold);border-color:var(--gold);opacity:1}
.stp.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.stp.on i{background:var(--accent);border-color:var(--accent);opacity:1}
@media (min-width:480px){ .stp{font-size:13px} }
.ltitle{display:grid;gap:6px;padding-top:4px}
.ltitle .ar{font:700 calc(1.75rem*var(--ar-scale))/1.6 var(--font-ard);text-align:right}
.para{display:grid;gap:12px;padding:20px 18px 14px}
.src{font-size:calc(1.6rem*var(--ar-scale));line-height:2.15;text-align:right}
.term{border-bottom:1.5px dotted color-mix(in srgb,var(--accent) 75%,transparent);cursor:pointer}
.term:hover{background:var(--accent-soft)}
.disc{justify-self:start;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding-inline:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--accent);font:600 14px var(--font-ui);margin-inline:-10px}
.disc svg{width:16px;height:16px;transition:transform .2s}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.pane{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.gl{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:baseline;font-size:14px;color:var(--muted)}
.gl .w{font-size:calc(1.25rem*var(--ar-scale));text-align:right;color:var(--ink);line-height:1.7}
.lead{font-size:17px;line-height:1.6}
.para-h{font:700 calc(1.15rem*var(--ar-scale))/1.6 var(--font-ard);color:var(--gold);direction:rtl;text-align:right}
.src .br{color:var(--muted);font-size:.85em}
.lnav{display:flex;gap:8px;margin-top:8px}
.lnav .btn:last-child{flex:1}
.lnav .btn.ghost{width:50px;padding:0}

/* fold (таблицы учебника) */
.fold{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.fold > button{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border:0;background:none;text-align:left;font:500 15px var(--font-ui)}
.fold > button svg{width:16px;height:16px;margin-left:auto;color:var(--muted);transition:transform .2s;flex:none}
.fold > button[aria-expanded="true"] svg{transform:rotate(90deg)}
.fold > button .ico{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.fold > button .ico svg{margin:0;width:16px;height:16px;transform:none!important;color:inherit}
.fold-b{display:grid;gap:12px;padding:2px 16px 18px}
.tb-sub{font:600 12px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.bookline{display:flex;align-items:center;gap:10px;margin-top:14px;font:600 11px var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.bookline::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--gold) 40%,transparent)}
.bookline + .fold,.fold + .fold{margin-top:-6px}

/* questions */
.qa{display:grid;gap:10px}
.q{padding:16px 16px 12px;display:grid;gap:8px}
.q-top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.dia{width:28px;height:28px;display:grid;place-items:center;position:relative;flex:none;font:700 13px var(--font-ui);color:var(--gold);font-variant-numeric:tabular-nums}
.dia::before{content:"";position:absolute;inset:4px;border:1.5px solid currentColor;transform:rotate(45deg);border-radius:3px}
.q .qar{font-size:calc(1.35rem*var(--ar-scale));line-height:1.85;direction:rtl;text-align:right}
.q .qru{font-size:14px;color:var(--muted);line-height:1.45}
.q .ans{border-left:2px solid var(--gold);padding:4px 0 4px 12px;font-size:15px;line-height:1.6}
.q .ans .w{font-size:1.28em;line-height:1.4}

/* exercises */
.ex{padding:16px 16px 14px;display:grid;gap:12px}
.ex-h{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ex-h .ru{font:600 15.5px/1.4 var(--font-ui);padding-top:3px}
.ex-ar{font-size:calc(1.2rem*var(--ar-scale));line-height:1.8;color:var(--muted);direction:rtl;text-align:right}
.ex-eg{padding:8px 12px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--gold) 55%,var(--line));display:grid;gap:2px}
.ex-eg .w{font-size:calc(1.15rem*var(--ar-scale));line-height:1.8;direction:rtl;text-align:right}
.ex-txt{padding:12px 14px;border-radius:12px;background:var(--surface-2);display:grid;gap:6px}
.ex-txt .w{font-size:calc(1.3rem*var(--ar-scale));line-height:2;direction:rtl;text-align:right}
.ex-words{font-size:calc(1.3rem*var(--ar-scale));line-height:1.9;direction:rtl;text-align:right}
.rows{display:grid}
.srow{display:flex;flex-wrap:wrap;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow > .w{font-size:calc(1.45rem*var(--ar-scale));line-height:1.7;text-align:right;direction:rtl;flex:0 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:5px;direction:rtl}
.chip{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 calc(1.05rem*var(--ar-scale))/1 var(--font-ar);color:var(--ink)}
.chip:not([disabled]):hover{border-color:var(--accent);color:var(--accent)}
.chip[disabled]{cursor:default;opacity:.55}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);opacity:1}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);opacity:1}
.chips.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.chips.wide .chip{padding:0 4px;font-size:calc(.98rem*var(--ar-scale))}
.why{flex-basis:100%;font-size:13.5px;color:var(--muted);line-height:1.45;direction:ltr;text-align:left}
.why b{color:var(--ok)} .why.bad b{color:var(--bad)}
.score{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);padding-top:4px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);font:500 13.5px var(--font-ui);padding:6px 0}
.rv{width:100%;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.rows > .rv:first-child,.rows > .rvw:first-child > .rv{border-top:0}
.rv > .w{grid-column:2;font-size:calc(1.45rem*var(--ar-scale));line-height:1.7;text-align:right;direction:rtl}
.rv .qm{grid-column:1;grid-row:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font:600 14px var(--font-ui)}
.rv .qm svg{width:15px;height:15px}
.rv[aria-expanded="true"] .qm{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.rv-a{display:grid;gap:4px;padding:0 0 12px 40px}
.rv-a .aa{font-size:calc(1.3rem*var(--ar-scale));line-height:1.8;direction:rtl;text-align:right;color:var(--accent)}
.rv-a .ar-ru{font-size:14.5px;color:var(--accent)}
.rv-a .ru{font-size:13.5px;color:var(--muted);line-height:1.45}
.rv-a .pg{margin-top:6px}
.lt-row{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.lt-row:first-child{border-top:0}
.lt-row .lts{display:flex;justify-content:flex-start;gap:6px;direction:rtl;flex-wrap:wrap;align-items:center}
.lt-row .lts .w{font-size:calc(1.4rem*var(--ar-scale));margin-left:auto;padding-left:10px}
.lt{width:44px;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font:700 calc(22px*var(--ar-scale))/1 var(--font-ar)}
.lt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.lt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.lt.miss{border-style:dashed;border-color:var(--ok)}
.lt[disabled]{cursor:default}
.lt-row .ck{justify-self:start;min-height:36px;padding-inline:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:500 14px var(--font-ui)}
.sample{padding:12px 14px;border-radius:12px;background:var(--gold-soft);font-size:15px;line-height:1.75}
.sample .w{font-size:1.25em}
.done-card{display:grid;gap:12px;justify-items:center;text-align:center;padding:26px 18px}
.done-card .star{width:40px;height:40px}
.done-card b{font:700 24px var(--font-d)}

/* worked */
.wk{display:grid;gap:14px}
.wk-word{text-align:center;font-size:calc(2.8rem*var(--ar-scale));line-height:1.5}
.wk-ru{text-align:center;color:var(--muted);margin-top:-12px;font-size:14.5px}
.wk-steps{display:grid;gap:6px}
.wk-step{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--surface-2)}
.wk-step .q{display:block;font-weight:600;font-size:14.5px}
.wk-step .a{grid-column:1;color:var(--muted);font-size:14px}
.wk-step .tg{grid-row:1/3;grid-column:2;font:700 calc(1.3rem*var(--ar-scale))/1.4 var(--font-ar);color:var(--accent)}
.wk-step.pending{opacity:.45}
.wk-step.ok{background:var(--ok-soft)} .wk-step.bad{background:var(--bad-soft)}
.wk-opts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chipb{min-height:36px;padding-inline:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:500 14px var(--font-ui)}
.wk-res{text-align:center;padding:10px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:calc(1.45rem*var(--ar-scale));font-weight:700;line-height:1.7}
.wk-wr{text-align:center;font:600 22px/1.3 var(--font-ui);padding-block:10px}

/* explanation blocks */
.fam{display:grid;gap:16px}
.core{display:flex;justify-content:center;gap:10px;direction:rtl}
.core div{display:grid;justify-items:center;gap:2px}
.core span{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font:700 calc(32px*var(--ar-scale))/1 var(--font-ar)}
.core small{font:500 calc(16px*var(--ar-scale)) var(--font-ar);color:var(--muted)}
.fc1{background:color-mix(in srgb,var(--r1) 13%,transparent);color:var(--r1)}
.fc2{background:color-mix(in srgb,var(--r2) 13%,transparent);color:var(--r2)}
.fc3{background:color-mix(in srgb,var(--r3) 13%,transparent);color:var(--r3)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.form{padding:6px 6px 10px;border-radius:12px;background:var(--surface-2);text-align:center;display:grid}
.form .w{font-size:calc(1.6rem*var(--ar-scale));line-height:1.75}
.form small{font-size:12.5px;color:var(--muted);line-height:1.3}
.q3{display:grid;gap:18px}
.q-h{display:flex;gap:10px;align-items:baseline;font-weight:600}
.qn{flex:none;font:700 17px var(--font-d);color:var(--gold)}
.q-a{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pill{padding:8px 12px 10px;border-radius:12px;background:var(--surface-2);display:grid;gap:0}
.pill small{font-size:12.5px;color:var(--muted)}
.pill b{font:700 calc(1.3rem*var(--ar-scale))/1.6 var(--font-ar);direction:rtl;text-align:right}
.pill .w{direction:rtl;text-align:right;font-size:calc(1.15rem*var(--ar-scale));line-height:1.5}
.passport{padding:14px;border-radius:14px;background:var(--gold-soft);text-align:center;display:grid;gap:2px}
.passport .ar{font-size:calc(1.5rem*var(--ar-scale));color:var(--ink);font-weight:700;line-height:1.7}
.passport small{color:var(--muted);font-size:13.5px}
.xcard{display:grid;gap:14px}
.sub{font:600 15px var(--font-ui)}
.rules{display:grid;gap:14px}
.rule{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.rule > .qn{padding-top:0}
.rule p + p,.rule p + .flow,.rule .flow + p,.rule .flow + .flow{margin-top:6px}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;direction:rtl;font-size:calc(1.45rem*var(--ar-scale));line-height:1.8}
.flow i{font-style:normal;color:var(--muted);font-size:15px}
.flow.sm{font-size:calc(1.25rem*var(--ar-scale));justify-content:flex-start}
.callout{padding:13px 15px;border-radius:14px;background:var(--gold-soft);font-size:15px;display:grid;gap:6px;border-left:2px solid var(--gold)}
.callout b{font-weight:600}
.pfx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:rtl}
.pfx div{padding:8px 6px 10px;border-radius:12px;background:var(--surface-2);text-align:center;display:grid;gap:2px}
.pfx .w{font-size:calc(1.9rem*var(--ar-scale));line-height:1.4;color:var(--accent);font-weight:700}
.pfx small{font-size:12px;color:var(--muted);line-height:1.3}
.gut{display:flex;justify-content:center;gap:6px;direction:rtl;flex-wrap:wrap}
.gut span{width:44px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 calc(24px*var(--ar-scale))/1 var(--font-ar)}

/* paradigm grids */
.pt{display:grid;gap:10px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;text-align:center;font-size:11.5px;color:var(--muted);gap:6px}
.cols span b{display:block;font:700 calc(1rem*var(--ar-scale))/1.5 var(--font-ar);color:var(--ink)}
.cols.two{grid-template-columns:repeat(3,1fr)}
.cg-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:4px}
.cg-h .w{font-size:calc(1.15rem*var(--ar-scale));font-weight:700;color:var(--gold)}
.cg-h small{color:var(--muted);font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;direction:rtl}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:5px 4px 7px;text-align:center;display:flex;flex-direction:column;min-width:0}
.cell > .w{font-size:calc(1.35rem*var(--ar-scale));line-height:1.75;overflow-wrap:anywhere}
.cell small{font-size:11px;color:var(--muted);direction:ltr;line-height:1.3}
.cell small .w{font-size:1.2em}
.cell.span2{grid-column:span 2}
.cell.nil > .w{color:var(--line)}
.fold .cell,.rv-a .cell{background:var(--bg)}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px;direction:rtl}
.rtable{width:100%;border-collapse:collapse;direction:rtl;font-size:14px}
.rtable th{font:600 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink)}
.rtable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable tr:last-child td{border-bottom:0}
@media (max-width:400px){.rtable th,.rtable td{padding-inline:5px}}
@media (max-width:359px){.rtable .nw{white-space:normal}}
.rtable .w{font-size:calc(1.2rem*var(--ar-scale));line-height:1.7}
.rtable td.ru{hyphens:auto;direction:ltr;text-align:left;color:var(--muted);font-size:13.5px;line-height:1.45}
.rtable td.ru .w:not(.nw){white-space:normal}
.rtable td.n{color:var(--muted);font-variant-numeric:tabular-nums;width:1%}

.mz-t td small .w{font-size:1.2em;line-height:1.5}
.mz-t tr.grp td{padding-top:14px;font:600 11px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--gold);direction:ltr;text-align:left;border-bottom:1px solid var(--line)}
.extra-note{border-left-color:var(--gold)}

/* conjugator */
.ctrl{display:grid;gap:10px}
.rchip{flex:none;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 calc(1.2rem*var(--ar-scale))/1 var(--font-ar)}
.rchip.ru{font:500 14px var(--font-ui);color:var(--muted)}
.rchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rchip.sm{min-height:36px;padding:0 12px;font-size:calc(1.05rem*var(--ar-scale))}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;min-height:48px;padding-inline:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 calc(20px*var(--ar-scale)) var(--font-ar);direction:rtl}
.inrow input::placeholder{font:400 14px var(--font-ui);color:var(--muted)}
.err{font-size:13.5px;color:var(--bad)}
.cj-hero{text-align:center;display:grid;gap:0;margin-top:4px}
.cj-big{font-size:calc(2.3rem*var(--ar-scale));line-height:1.6}
.cj-big .dash{color:var(--muted);margin-inline:10px}
.cj-meta{font-size:13.5px;color:var(--muted)}
.cj-part{color:var(--muted);font-size:.8em;margin-left:6px}
.pt-meta{text-align:center;font-size:13.5px;color:var(--muted);margin-top:-4px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(14,12,8,.42);animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:620px;margin-inline:auto;max-height:86vh;overflow:auto;
  background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .25s ease;display:grid;gap:14px}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
.sheet h3{font:700 24px var(--font-d)}
.arsize{display:flex;align-items:center;gap:12px}
.arsize input{flex:1;accent-color:var(--accent)}
.sample-ar{font-size:calc(1.5rem*var(--ar-scale));text-align:center;padding:10px;border-radius:12px;background:var(--surface-2);line-height:1.9}
.term-sh{display:grid;gap:6px;text-align:center;padding-block:6px}
.term-sh .ar{font-size:calc(2.3rem*var(--ar-scale));line-height:1.6}
.term-sh .ru{font:600 18px var(--font-ui)}
.term-sh p{color:var(--muted);max-width:44ch;margin-inline:auto}

@media (min-width:560px){ .mast .ar{font-size:calc(3.4rem*var(--ar-scale))} .medal{width:96px;height:96px} }
@media (max-width:400px){ .stp{font-size:11.5px;letter-spacing:-.01em} } @media (max-width:380px){ .resume{gap:14px;padding:18px} .medal{width:72px;height:72px} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ 2.0: цели, проигрыватель заданий, клавиатура, умения ============ */
.steps{grid-template-columns:repeat(6,minmax(0,1fr))}
.view > *{min-width:0}
.goals{display:grid;gap:10px}
.goals ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.goals li{display:grid;gap:2px;font-size:15px;line-height:1.45}
.lvl{justify-self:start;font:600 10.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.src-line{font-size:12.5px;color:var(--muted);line-height:1.5;padding-inline:2px}
.callout .linkbtn{padding:0;font-size:inherit}
.run{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;position:relative}
.run::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.run-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.run-n{font:500 12.5px var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.tk{display:grid;gap:14px}
.tk-q{font:500 16px/1.5 var(--font-ui)}
.tk-w{display:grid;justify-items:center;gap:0;text-align:center}
.tk-w > .w{font-size:calc(2.2rem*var(--ar-scale));line-height:1.7}
.tk-w small{color:var(--muted);font-size:14px}
.tk-w .gap{color:var(--accent);text-decoration:underline dotted;text-underline-offset:.35em;font-weight:inherit}
.tk-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:5px}
.tk-row .cell > .w{font-size:calc(1.3rem*var(--ar-scale))}
.tk-row .cell.blank{border-style:dashed;border-color:var(--accent);background:var(--accent-soft);justify-content:center}
.tk-row .qm{font:700 22px/1.75 var(--font-ui);color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:50px;padding:8px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);text-align:left;font:500 15px/1.4 var(--font-ui);color:var(--ink)}
.opt .w{font-size:calc(1.35rem*var(--ar-scale));line-height:1.5}
.opt .mk{font-size:calc(1.6rem*var(--ar-scale));line-height:1;color:var(--accent)}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);opacity:.8}
.need{font-size:13px;color:var(--muted);line-height:1.45}
.kin-w{display:grid}
.kin{width:100%;min-height:62px;padding:4px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:400 calc(2rem*var(--ar-scale))/1.6 var(--font-ar);text-align:center;direction:rtl;caret-color:var(--accent)}
.kin:focus{outline:none;border-color:var(--accent)}
.echo{text-align:center;font:400 calc(1.8rem*var(--ar-scale))/1.7 var(--font-ar);margin-top:-6px}
.echo .bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:.4em;text-decoration-thickness:1.5px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.kb-m{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.k{min-height:46px;padding:2px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font:400 calc(22px*var(--ar-scale))/1 var(--font-ar);color:var(--ink);display:grid;place-items:center;align-content:center;gap:2px}
.k:active{transform:scale(.95);background:var(--accent-soft)}
.k.m span{font-size:calc(24px*var(--ar-scale));line-height:1.1}
.k.m small{font:500 9.5px var(--font-ui);color:var(--muted);direction:ltr}
.k.del{font:500 18px var(--font-ui);color:var(--muted)}
.fb{font-size:14.5px;line-height:1.5;border-radius:12px}
.fb:empty{display:none}
.fb.ok,.fb.bad,.fb.warn,.fb.info{padding:11px 13px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.warn,.fb.info{background:var(--surface-2)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb .hint{display:block;margin-top:4px;color:var(--muted)}
.tk-ans{text-align:center;font:400 calc(2.2rem*var(--ar-scale))/1.7 var(--font-ar);color:var(--ok)}
.tk-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tk-act .btn{flex:1 1 140px}
.tk-help{display:flex;gap:14px;margin-left:auto}
.tk-lts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tk-lts .lt{width:auto;min-width:46px;padding-inline:6px}
.sum{display:grid;gap:8px}
.sum-r{display:grid;gap:4px;font-size:14px}
.sum-c{display:flex;flex-wrap:wrap;gap:5px}
.rs{font:500 12px var(--font-ui);font-style:normal;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.rs.solo{background:var(--ok-soft);color:var(--ok)} .rs.shown,.rs.fail{background:var(--bad-soft);color:var(--bad)}
.sd{display:inline-block;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--line);flex:none}
.sd.kept{background:var(--gold);border-color:var(--gold)}
.sd.solo{background:var(--ok);border-color:var(--ok)}
.sd.hint{background:var(--gold-soft);border-color:var(--gold)}

.sdots{display:inline-flex;gap:6px;align-items:center}
.li .st{display:grid;justify-items:end;gap:3px}
.li .st small{font-size:11.5px}
.sk-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.sk-legend span{display:inline-flex;align-items:center;gap:7px}
.sk-card{display:grid;gap:2px;padding-block:12px}
.sk-h{display:flex;gap:8px;align-items:baseline;font-size:14px;padding-bottom:6px}
.sk-h span{color:var(--muted)}
.sk-list{display:grid;gap:2px}
.sk-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit;font:inherit}
.sk-list .sk-row:first-child,.sk-h + .sk-row{border-top:0}
.sk-row b{display:block;font-weight:500;font-size:14.5px;line-height:1.4}
.sk-row small{display:block;font-size:12.5px;color:var(--muted)}
.sk-row .go svg{width:16px;height:16px;color:var(--muted)}
.sk-row.dim{opacity:.55}
.wk-step.do{grid-template-columns:1fr;background:var(--accent-soft)}
.wk-run .run{padding:12px;border-radius:14px}
.wk-run .run::before{display:none}
.wk-why{display:grid;gap:4px}
.sheet .run{border:0;padding:0}
.sheet .run::before{display:none}
@media (max-width:400px){ .nav button{padding-inline:12px 14px;gap:5px;font-size:13.5px} .stp{font-size:10.5px} }
@media (max-width:350px){ .nav button svg{display:none} }

/* ============ ТЕМА «ТЕТРАДЬ»: форма, знак из трёх точек, правки по аудиту ============ */
a{color:var(--accent);text-underline-offset:.2em}
/* знак: три точки цветов ف ع ل */
.star{width:26px;height:11px}
.brand{font:700 20px/1 var(--font-d);letter-spacing:0}
.brand .ar{font-size:18px}
.h1{font:700 28px/1.15 var(--font-d);letter-spacing:0}
.h2{font:600 21px/1.25 var(--font-d);gap:12px}
.h2::before{width:6px;height:6px;border-radius:50%;transform:none;background:var(--r1);box-shadow:9px 0 var(--r2),18px 0 var(--r3);margin-right:18px}
.sheet h3{font:700 21px var(--font-d)}
.done-card b{font:700 22px var(--font-d)}
.done-card .star{width:52px;height:22px}
.qn{font:700 15px var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
/* панели непрозрачные */
.top,.steps{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.icon-btn{width:44px;height:44px}
/* нижняя панель вкладок во всю ширину */
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.nav{left:0;right:0;bottom:0;transform:none;justify-content:center;gap:6px;border-radius:0;border:0;border-top:1px solid var(--line);
  background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav button{flex:1 1 0;max-width:200px;flex-direction:column;justify-content:center;gap:2px;min-height:54px;padding-inline:6px;border-radius:14px;font:500 12.5px var(--font-ui)}
.nav button svg{width:21px;height:21px;display:block}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
/* форма: крупные скругления, мягкая тень у карточек */
.card,.run,.resume{border-radius:24px;box-shadow:var(--shadow)}
.fold{border-radius:20px;box-shadow:var(--shadow)}
.sheet .run,.wk-run .run{box-shadow:none}
.btn{min-height:52px;border-radius:16px;font-size:16px}
.btn.ghost{border-color:var(--line-strong)}
.opt,.kin,.callout,.passport,.wk-res{border-radius:16px}
.resume::after,.run::before{display:none}
.callout{border-left:0}
.q .ans{border-left:0;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.seg button{min-height:44px}
.seg button.on{background:var(--seg-on)}
.scrim{background:rgba(10,12,16,.6)}
.view{animation:rise .2s ease-out both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
/* главная */
.medal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:76px;height:76px;border-radius:18px;background:var(--surface-2);color:var(--ink)}
.medal svg{position:static;width:30px;height:12px}
.medal b{color:var(--ink);padding-top:0;font-size:calc(1.9rem*var(--ar-scale))}
.resume .lbl{color:var(--muted)}
.resume .tx{gap:6px}
.pips i,.stp i,.legend i,.sd{transform:none;border-radius:50%}
.pips i{border-color:var(--line-strong)}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.thread::before{background:var(--line)}
.li .node svg{color:var(--line-strong)}
.li.done .node svg{color:var(--gold)}
.li.done .node svg .fill{fill:var(--gold-soft)}
.li.done .node b{color:var(--gold)}
.li.cur .node svg{color:var(--accent)}
.li.cur .node svg .fill{fill:var(--accent)}
.li.cur .node b{color:var(--accent-ink)}
.li .node b{font-size:12px}
.li .st.ok{color:var(--gold)}
/* шаги урока */
.stp{border-radius:12px;font-size:12.5px}
.stp i{width:8px;height:8px}
.stp.seen i{background:var(--muted);border-color:var(--muted)}
.stp.on i{background:var(--accent);border-color:var(--accent)}
@media (max-width:420px){
  .steps{display:flex;gap:2px}
  .stp{flex:1 1 0;font-size:0;letter-spacing:0;min-width:36px}
  .stp.on{flex:0 0 auto;flex-direction:row;gap:8px;padding-inline:12px;font-size:13px}
}
/* арабский текст никогда не наследует шрифт интерфейса */
.ex-ar,.ex-words,.ex-txt .w,.q .qar,.rv-a .aa,.src,.gl .w,.flow,.cell > .w{font-family:var(--font-ar)}
/* мелкие подписи не меньше 12px */
.lbl,.bookline,.rtable th,.mz-t tr.grp td{font-size:12px;letter-spacing:.06em}
.tag-x,.lvl{font-size:12px;letter-spacing:.05em}
.cell small,.cols{font-size:12px}
.k.m small{font-size:11px}
.li .st small{font-size:12px}
.note{font-size:15px}
/* зоны нажатия от 44px, зазор между вариантами 8px */
.chips{gap:8px}
.chip{min-height:44px;border-radius:12px;border-color:var(--line-strong)}
.chipb,.lt-row .ck,.rchip.sm{min-height:44px;border-radius:12px}
.disc{min-height:44px}
.linkbtn{padding:12px 0}
.rv .qm{width:36px;height:36px}
.rv-a{padding-left:46px}
.opt,.lt,.kin,.inrow input{border-color:var(--line-strong)}
.kin:focus,.inrow input:focus{border-color:var(--accent)}
/* неактивное — цветом, а не прозрачностью; статус — со значком */
.chip[disabled]{opacity:1;color:var(--muted);border-color:var(--line)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.chip.ok::before,.opt.ok::before{content:"✓";font:700 14px var(--font-ui);color:var(--ok);margin-inline-end:6px}
.chip.bad::before,.opt.bad::before{content:"✕";font:700 13px var(--font-ui);color:var(--bad);margin-inline-end:6px}
.opt.ok{color:var(--ink)} .opt.bad{color:var(--ink);opacity:1}
.wk-step.pending{opacity:1}
.wk-step.pending .q,.wk-step.pending .tg{color:var(--muted)}
.sk-row.dim{opacity:1}
.sk-row.dim b{color:var(--muted)}
.cell.nil > .w{color:var(--muted)}
.dia{color:var(--muted)}
.dia::before{transform:none;border-radius:50%;inset:1px;border-color:var(--line-strong)}
.fold > button .ico{border-radius:10px}
@media (max-width:400px){ .nav button{padding-inline:6px;font-size:12.5px} }
@media (max-width:350px){ .nav button svg{display:block} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="nav" id="nav" aria-label="Разделы"></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script>
/* ============ HELPERS ============ */
const $ = (s, el = document) => el.querySelector(s);
const col = s => s.replace(/\[([1-4])([^\]]+)\]/g, '<span class="r$1">$2</span>');
const ar = (s, cls = '') => `<span class="w ${cls}${/^[^\s،]+ [–←→] [^\s،]+$/.test(s) ? ' nw' : ''}" dir="rtl" lang="ar">${col(s.replace(/→/g, '←'))}</span>`;
// короткий термин не рвём между строками: разорванная RTL-фраза читается задом наперёд
const a = s => ar(s, s.trim().split(/\s+/).length <= 4 && s.length <= 48 ? 'inl nw' : 'inl');
const T = (k, s) => `<span class="term" data-term="${k}" role="button" tabindex="0">${s}</span>`;
const BR = s => `<span class="br">${s}</span>`;
const shuffle = arr => { const r = arr.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const plural = (n, f) => { const m10 = n % 10, m100 = n % 100; return f[(m10 === 1 && m100 !== 11) ? 0 : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? 1 : 2]; };
const hasAr = s => /[؀-ۿ]/.test(s);
const mix = s => s.includes('<') ? s : (s.includes('→') ? s.replace(/،\s*/g, ', ') : s).replace(/[؀-ۿ](?:[؀-ۿ\s]*[؀-ۿ])?/g, m => a(m));

const STAR = '<svg viewBox="0 0 24 10" aria-hidden="true"><circle cx="4" cy="5" r="3.4" fill="var(--r1)"/><circle cx="12" cy="5" r="3.4" fill="var(--r2)"/><circle cx="20" cy="5" r="3.4" fill="var(--r3)"/></svg>';
const ic = d => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  course: ic('<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v14H6.5A1.5 1.5 0 0 0 5 18.5zM5 18.5A1.5 1.5 0 0 0 6.5 20H19"/>'),
  review: ic('<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/>'),
  ref: ic('<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M10 9.5v10"/>'),
  sliders: ic('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  back: ic('<path d="M15 5l-7 7 7 7"/>'),
  chev: ic('<path d="M9 5l7 7-7 7"/>'),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
};

/* building blocks for explanations */
const tb = (head, rows, cls = '') => `<div class="tbl-wrap"><table class="rtable ${cls}"><thead><tr>${head.map((h, i) => `<th${rows[0][i] && (rows[0][i].startsWith('!') || !hasAr(rows[0][i])) ? ' style="text-align:left"' : ''}><bdi dir="ltr">${h}</bdi></th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => c.startsWith('!') ? `<td class="ru">${mix(c.slice(1))}</td>` : hasAr(c) ? `<td>${ar(c)}</td>` : `<td class="ru">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const flow = (items, cls = '') => `<div class="flow ${cls}">${items.map(x => ar(x)).join('<i>←</i>')}</div>`;
const rules = list => `<div class="rules">${list.map((r, i) => `<div class="rule"><span class="qn">${i + 1}</span><div>${r}</div></div>`).join('')}</div>`;
const legend = () => `<div class="legend"><span><i class="c1"></i>1-я корневая (ف)</span><span><i class="c2"></i>2-я (ع)</span><span><i class="c3"></i>3-я (ل)</span><span><i class="c0"></i>добавочные</span></div>`;

/* ============ STATE ============ */
const LS = 'tasrif2.v1';
const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
const S = Object.assign({ theme: 'auto', ar: 1, at: {}, max: {}, done: {}, log: [], seen: {}, run: {}, act: 0, last: 1 }, load());
delete S.cards;
const persist = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyLook() {
  const r = document.documentElement;
  if (S.theme === 'auto') { hostTheme ? r.setAttribute('data-theme', hostTheme) : r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme', S.theme);
  r.style.setProperty('--ar-scale', S.ar);
}

/* ============ CONJUGATION ENGINE ============ */
const V = { a: 'َ', u: 'ُ', i: 'ِ', o: 'ْ' };
const BABS = [
  { id: 'nasara', m: 'a', u: 'u', ex: 'نصر', ru: 'помогать' },
  { id: 'daraba', m: 'a', u: 'i', ex: 'ضرب', ru: 'бить' },
  { id: 'fataha', m: 'a', u: 'a', ex: 'فتح', ru: 'открывать' },
  { id: 'samia', m: 'i', u: 'a', ex: 'سمع', ru: 'слышать' },
  { id: 'hasiba', m: 'i', u: 'i', ex: 'حسب', ru: 'считать, полагать' },
  { id: 'karuma', m: 'u', u: 'u', ex: 'كرم', ru: 'быть щедрым' },
];
const M_END = [['a', ''], ['a', 'ا'], ['u', 'وا'], ['a', 'تْ'], ['a', 'تَا'], ['o', 'نَ'], ['o', 'تَ'], ['o', 'تُمَا'], ['o', 'تُمْ'], ['o', 'تِ'], ['o', 'تُمَا'], ['o', 'تُنَّ'], ['o', 'تُ'], ['o', 'نَا']];
const U_PRE = ['يَ', 'يَ', 'يَ', 'تَ', 'تَ', 'يَ', 'تَ', 'تَ', 'تَ', 'تَ', 'تَ', 'تَ', 'أَ', 'نَ'];
const U_END = [['u', ''], ['a', 'انِ'], ['u', 'ونَ'], ['u', ''], ['a', 'انِ'], ['o', 'نَ'], ['u', ''], ['a', 'انِ'], ['u', 'ونَ'], ['i', 'ينَ'], ['a', 'انِ'], ['o', 'نَ'], ['u', ''], ['u', '']];
const N_END = [['a', ''], ['a', 'ا'], ['u', 'وا'], ['a', ''], ['a', 'ا'], ['o', 'نَ'], ['a', ''], ['a', 'ا'], ['u', 'وا'], ['i', 'ي'], ['a', 'ا'], ['o', 'نَ'], ['a', ''], ['a', '']];
const J_END = N_END.map((e, k) => [0, 3, 6, 12, 13].includes(k) ? ['o', ''] : e);
const PRON = [['هُوَ', 'он'], ['هُمَا', 'они двое'], ['هُمْ', 'они'], ['هِيَ', 'она'], ['هُمَا', 'они две'], ['هُنَّ', 'они (ж.)'], ['أَنْتَ', 'ты'], ['أَنْتُمَا', 'вы двое'], ['أَنْتُمْ', 'вы'], ['أَنْتِ', 'ты (ж.)'], ['أَنْتُمَا', 'вы две'], ['أَنْتُنَّ', 'вы (ж.)'], ['أَنَا', 'я'], ['نَحْنُ', 'мы']];
const GROUPS = [
  { h: 'الْغَائِبُ', ru: '3-е лицо', rows: [[0, 1, 2], [3, 4, 5]] },
  { h: 'الْمُخَاطَبُ', ru: '2-е лицо', rows: [[6, 7, 8], [9, 10, 11]] },
  { h: 'الْمُتَكَلِّمُ', ru: '1-е лицо', rows: [[12, 13]] },
];
const G2 = [GROUPS[1]];
/* t: m прошедшее, u мудари‘, n после لَنْ, j после لَمْ, a повеление; pv: страдательный */
function form(root, bab, t, k, pv) {
  const [f, c, l] = root;
  if (t === 'm') { const [e, s] = M_END[k]; return pv ? `[1${f}ُ][2${c}ِ][3${l}${V[e]}]${s}` : `[1${f}َ][2${c}${V[bab.m]}][3${l}${V[e]}]${s}`; }
  const [e, s] = (t === 'u' ? U_END : t === 'n' ? N_END : J_END)[k];
  const cv = pv ? 'a' : bab.u;
  if (t === 'a') return k >= 6 && k <= 11 ? `${bab.u === 'u' ? 'اُ' : 'اِ'}[1${f}ْ][2${c}${V[cv]}][3${l}${V[e]}]${s}` : 'لِ' + form(root, bab, 'j', k, pv);
  const pre = pv ? U_PRE[k].replace('َ', 'ُ') : U_PRE[k];
  return `${pre}[1${f}ْ][2${c}${V[cv]}][3${l}${V[e]}]${s}`;
}
const MZ = ['ف', 'ع', 'ل'];
const NSR = ['ن', 'ص', 'ر'];
const babById = id => BABS.find(b => b.id === id);
function paradigm(fn, groups = GROUPS) {
  const cells = (row, last) => row.map((k, j) => `<div class="cell ${last && j === 1 ? 'span2' : ''}">${ar(fn(k))}<small>${ar(PRON[k][0])} · ${PRON[k][1]}</small></div>`).join('');
  return `<div class="cols"><span><b>مُفْرَدٌ</b><bdi dir="ltr">ед. ч.</bdi></span><span><b>مُثَنًّى</b><bdi dir="ltr">дв. ч.</bdi></span><span><b>جَمْعٌ</b><bdi dir="ltr">мн. ч.</bdi></span></div>
  ${groups.map(g => `<div class="cg-h">${ar(g.h)}<small>${g.ru}</small></div>${g.rows.map(r => `<div class="cgrid">${cells(r, r.length === 2)}</div>`).join('')}`).join('')}`;
}

/* ============ REFERENCE TABLES (used in lessons too) ============ */
const BOOK_BABS = [
  ['[1خَ][2رَ][3جَ] – يَ[1خْ][2رُ][3جُ]', '[1خُ][2رُ]و[3جٌ]', 'выходить'],
  ['[1ضَ][2رَ][3بَ] – يَ[1ضْ][2رِ][3بُ]', '[1ضَ][2رْ][3بٌ]', 'бить'],
  ['[1سَ][2أَ][3لَ] – يَ[1سْ][2أَ][3لُ]', '[1سُ][2ؤَ]ا[3لٌ]', 'спрашивать'],
  ['[1عَ][2لِ][3مَ] – يَ[1عْ][2لَ][3مُ]', '[1عِ][2لْ][3مٌ]', 'знать'],
  ['[1حَ][2سِ][3بَ] – يَ[1حْ][2سِ][3بُ]', '[1حِ][2سَ]ا[3بٌ]', 'считать, полагать'],
  ['[1حَ][2سُ][3نَ] – يَ[1حْ][2سُ][3نُ]', '[1حُ][2سْ][3نٌ]', 'быть красивым'],
];
const tblBabs = () => `<div class="tbl-wrap"><table class="rtable mz-t"><thead><tr><th>№</th><th>Вес</th><th>Пример и масдар</th></tr></thead><tbody>${BABS.map((b, i) => `<tr><td class="n">${i + 1}</td><td>${ar(form(MZ, b, 'm', 0) + ' – ' + form(MZ, b, 'u', 0))}</td><td>${ar(BOOK_BABS[i][0])}<small>${ar(BOOK_BABS[i][1])} · ${BOOK_BABS[i][2]}</small></td></tr>`).join('')}</tbody></table></div>`;

const MAZID = [
  ['Трёхбуквенный +1 буква: 4 буквы в прошедшем'],
  ['أَفْعَلَ', 'أَ[1كْ][2رَ][3مَ]', 'إِ[1كْ][2رَ]ا[3مٌ]', 'оказать почёт', `${a('أَ')} в начале`],
  ['فَعَّلَ', '[1فَ][2رَّ][3حَ]', 'تَ[1فْ][2رِ]ي[3حٌ]', 'обрадовать', 'удвоение ع'],
  ['فَاعَلَ', '[1قَ]ا[2تَ][3لَ]', 'مُ[1قَ]ا[2تَ][3لَ]ةٌ، [1قِ][2تَ]ا[3لٌ]', 'сражаться', `${a('ا')} после ف`],
  ['Трёхбуквенный +2: 5 букв'],
  ['تَفَعَّلَ', 'تَ[1كَ][2سَّ][3رَ]', 'تَ[1كَ][2سُّ][3رٌ]', 'ломаться', `${a('تَ')} + удвоение ع`],
  ['تَفَاعَلَ', 'تَ[1بَ]ا[2عَ][3دَ]', 'تَ[1بَ]ا[2عُ][3دٌ]', 'удаляться', `${a('تَ')} + ${a('ا')}`],
  ['اِنْفَعَلَ', 'اِنْ[1قَ][2طَ][3عَ]', 'اِنْ[1قِ][2طَ]ا[3عٌ]', 'прекращаться', `${a('اِ')} + ${a('نْ')}`],
  ['اِفْتَعَلَ', 'اِ[1جْ]تَ[2مَ][3عَ]', 'اِ[1جْ]تِ[2مَ]ا[3عٌ]', 'объединяться, собираться', `${a('اِ')} + ${a('تَ')} после ف`],
  ['اِفْعَلَّ', 'اِ[1حْ][2مَ][3رَّ]', 'اِ[1حْ][2مِ][3رَ]ا[3رٌ]', 'краснеть', `${a('اِ')} + удвоение ل`],
  ['Трёхбуквенный +3: 6 букв'],
  ['اِسْتَفْعَلَ', 'اِسْتَ[1خْ][2رَ][3جَ]', 'اِسْتِ[1خْ][2رَ]ا[3جٌ]', 'извлекать', `${a('اِ')} + ${a('سْ')} + ${a('تَ')}`],
  ['اِفْعَالَّ', 'اِ[1حْ][2مَ]ا[3رَّ]', 'اِ[1حْ][2مِ]ي[3رَ]ا[3رٌ]', 'сильно краснеть', `${a('اِ')} + ${a('ا')} + удвоение ل`],
  ['اِفْعَوْعَلَ', 'اِ[1عْ][2شَ]وْشَ[3بَ]', 'اِ[1عْ][2شِ]ي[2شَ]ا[3بٌ]', 'покрыться густой травой', `${a('اِ')} + ${a('وْ')} + повтор ع`],
  ['اِفْعَنْلَلَ', 'اِ[1قْ][2عَ]نْ[3سَ]سَ', 'اِ[1قْ][2عِ]نْ[3سَ]ا[3سٌ]', 'выпятить грудь', `${a('اِ')} + ${a('نْ')} + повтор ل`],
  ['اِفْعَنْلَى', 'اِ[1سْ][2لَ]نْ[3قَ]ى', 'اِ[1سْ][2لِ]نْ[3قَ]اءٌ', 'лежать на спине', `${a('اِ')} + ${a('نْ')} + ${a('ى')}`],
  ['Четырёхбуквенный с добавками'],
  ['تَفَعْلَلَ', 'تَ[1دَ][2حْ][3رَ][4جَ]', 'تَ[1دَ][2حْ][3رُ][4جٌ]', 'скатываться', `${a('تَ')}`],
  ['اِفْعَنْلَلَ', 'اِ[1حْ][2رَ]نْ[3جَ][4مَ]', 'اِ[1حْ][2رِ]نْ[3جَ]ا[4مٌ]', 'собираться (о стаде)', `${a('اِ')} + ${a('نْ')}`],
  ['اِفْعَلَلَّ', 'اِ[1قْ][2شَ][3عَ][4رَّ]', 'اِ[1قْ][2شِ][3عْ][4رَ]ا[4رٌ]', 'содрогаться', `${a('اِ')} + удвоение последней`],
];
const tblMazid = () => `<div class="tbl-wrap"><table class="rtable mz-t"><thead><tr><th>Вес</th><th>Пример и масдар</th><th style="text-align:left">Что добавлено</th></tr></thead><tbody>${MAZID.map(r => r.length === 1
  ? `<tr class="grp"><td colspan="3">${r[0]}</td></tr>`

/* ---------- 15: основной текст с фотографий учебника ---------- */
{ n: 15, ar: 'الْمُضَاعَفُ وَالْإِدْغَامُ', ru: 'Повторяющиеся корневые буквы и их слияние', short: 'Повторение букв и слияние', min: 18,
  text: [
    { src: `فَصْلُ الْمُضَاعَفِ وَيُقَالُ لَهُ الْأَصَمُّ، وَهُوَ مِنَ الثُّلَاثِيِّ الْمُجَرَّدِ وَالْمَزِيدِ فِيهِ مَا كَانَ عَيْنُهُ وَلَامُهُ مِنْ جِنْسٍ وَاحِدٍ كَرَدَّ وَأَعَدَّ، فَإِنَّ أَصْلَهُمَا رَدَدَ وَأَعْدَدَ، وَمِنَ الرُّبَاعِيِّ مَا كَانَ فَاؤُهُ وَلَامُهُ الْأُولَى مِنْ جِنْسٍ وَاحِدٍ وَكَذَلِكَ عَيْنُهُ وَلَامُهُ الثَّانِيَةُ أَيْضًا، وَيُقَالُ لَهُ الْمُطَابِقُ أَيْضًا نَحْوُ: زَلْزَلَ يُزَلْزِلُ زَلْزَلَةً وَزِلْزَالًا.`,
      tr: 'Раздел о مُضَاعَفٌ; его также называют الْأَصَمُّ. У трёхкорневого глагола, без добавок или с добавками, это глагол с одинаковыми второй и третьей коренными: رَدَّ «вернул» и أَعَدَّ «подготовил». Их исходное строение — رَدَدَ и أَعْدَدَ. У четырёхкорневого совпадают первая с третьей и вторая с четвёртой: زَلْزَلَ «сотряс», يُزَلْزِلُ «сотрясает», زَلْزَلَةً и زِلْزَالًا «сотрясение». Такой глагол также называют الْمُطَابِقُ.',
      gl: [['مِنْ جِنْسٍ وَاحِدٍ', 'одна и та же согласная'], ['الْأَصَمُّ', 'буквально «глухой»; другое название этого вида глаголов'], ['الْمُطَابِقُ', 'буквально «соответствующий»; здесь — с повторением двух корневых пар'], ['أَصْلُهُمَا', 'их исходное строение до изменения']] },
    { src: `وَإِنَّمَا أُلْحِقَ الْمُضَاعَفُ بِالْمُعْتَلَّاتِ لِأَنَّ حَرْفَ التَّضْعِيفِ يَلْحَقُهُ ${T('ibdal', 'الْإِبْدَالُ')} كَقَوْلِهِمْ: أَمْلَيْتُ بِمَعْنَى أَمْلَلْتُ، وَ${T('hadhf', 'الْحَذْفُ')} كَقَوْلِهِمْ: مَسْتُ وَظَلْتُ بِفَتْحِ الْفَاءِ وَكَسْرِهَا وَأَحَسْتُ، أَيْ مَسِسْتُ وَظَلِلْتُ وَأَحْسَسْتُ.`,
      tr: 'Глагол с повторяющимися корневыми рассматривают рядом со слабыми глаголами, потому что повторяющаяся буква может заменяться или выпадать. Пример замены: أَمْلَيْتُ в значении أَمْلَلْتُ «я продиктовал». Примеры выпадения: مَسْتُ / مِسْتُ «я коснулся», ظَلْتُ / ظِلْتُ «я оставался» — с фатхой или касрой на первой коренной, а также أَحَسْتُ «я почувствовал». Их полные формы: مَسِسْتُ، ظَلِلْتُ، أَحْسَسْتُ.',
      gl: [['أُلْحِقَ بِـ', 'присоединён к рассмотрению вместе с…'], ['الْإِبْدَالُ', 'замена одной буквы другой'], ['الْحَذْفُ', 'сбрасывание буквы: она выпадает'], ['بِفَتْحِ الْفَاءِ وَكَسْرِهَا', 'с фатхой или касрой на первой коренной']] },
    { src: `وَالْمُضَاعَفُ يَلْحَقُهُ ${T('idgham', 'الْإِدْغَامُ')}، وَهُوَ أَنْ تُسَكِّنَ الْأَوَّلَ وَتُدْرِجَ فِي الثَّانِي، وَيُسَمَّى الْأَوَّلُ مُدْغَمًا وَالثَّانِي مُدْغَمًا فِيهِ.`,
      tr: 'У глагола с повторяющимися корневыми бывает الْإِدْغَامُ: первую из двух одинаковых соседних согласных делают безгласной и вводят во вторую. Первая называется مُدْغَمٌ «вводимая», а вторая — مُدْغَمٌ فِيهِ «та, в которую вводят». На письме получается одна буква с шаддой; при произношении это удвоенная согласная.',
      gl: [['أَنْ تُسَكِّنَ الْأَوَّلَ', 'сделать первую согласную безгласной'], ['تُدْرِجَ فِي الثَّانِي', 'ввести во вторую'], ['مُدْغَمٌ', 'первая согласная: её вводят во вторую'], ['مُدْغَمٌ فِيهِ', 'вторая согласная: в неё вводят первую']] },
  ],
  ex: () => `
  <h2 class="h2">Сначала найдите корень</h2>
  <p class="lead">${a('مُضَاعَفٌ')} определяют по <b>корневым буквам</b>. Шадда сама по себе ещё не доказывает, что глагол относится к этому виду.</p>
  <div class="card">${rules([
    `<p><b>Три корневые:</b> вторая и третья одинаковы. В ${a('رَدَّ')} корень ${a('ر د د')}; в ${a('أَعَدَّ')} — ${a('ع د د')}. Добавочная хамза этого не меняет.</p>`,
    `<p><b>Четыре корневые:</b> повторяется пара букв. В ${a('زَلْزَلَ')} корень ${a('ز ل ز ل')}: первая равна третьей, вторая — четвёртой. Одинаковые согласные не стоят рядом, поэтому здесь <b>нет слияния</b>.</p>`,
    `<p><b>Шадда от веса:</b> у ${a('عَظَّمَ')} корень ${a('ع ظ م')}, все три корневые разные. Удвоение ${a('ظ')} пришло с весом ${a('فَعَّلَ')}; это не ${a('مُضَاعَفٌ')} по корню.</p>`,
  ])}</div>
  <h2 class="h2">Как две согласные становятся одной с шаддой</h2>
  <div class="card"><p>В ${a('مَدَدَ')} первая из двух ${a('د')} теряет фатху. Затем ${a('دْ + دَ')} записывают как ${a('دَّ')}:</p>
  ${flow(['مَدَدَ', 'مَدْدَ', 'مَدَّ'], 'sm')}
  <p>В ${a('يَمْدُدُ')} перед парой букв стоит ${a('مْ')}. Дамму с первой ${a('د')} сначала переносят на ${a('م')}, затем сливают две ${a('د')}:</p>
  ${flow(['يَمْدُدُ', 'يَمُدْدُ', 'يَمُدُّ'], 'sm')}
  <p class="note">Формы до слияния здесь показывают <b>этапы разбора</b>, а не ещё один вариант произношения обычной формы.</p></div>
  <div class="callout"><b>Корень остаётся тем же</b><span>В ${a('مَدَّ')} шадда обозначает две корневые ${a('د')}. В ${a('مَدَدْتُ')} «я протянул» обе видны отдельно: перед ${a('تُ')} последняя коренная безгласная, сливать её с предыдущей здесь нельзя. Вид глагола при этом не меняется.</span></div>
  <h2 class="h2">Почему тема стоит рядом со слабыми глаголами</h2>
  <p>Общее у них — <b>изменения букв</b>: замена и выпадение. Это не означает, что у ${a('رَدَّ')} появилась слабая буква. По делению этого учебника ${a('مُضَاعَفٌ')} не относится к ${a('سَالِمٌ')}, даже если в корне нет ${a('و، ي')} или хамзы.</p>
  <div class="callout"><b>Сокращённые формы — узнавать, а не строить от любого глагола</b><span>${a('مَسْتُ، مِسْتُ، ظَلْتُ، ظِلْتُ، أَحَسْتُ')} — засвидетельствованные сокращения. Обычные полные формы: ${a('مَسِسْتُ، ظَلِلْتُ، أَحْسَسْتُ')}. По их образцу нельзя сокращать ${a('مَدَدْتُ')}.</span></div>
  <p class="note">В этом уроке — определение и принцип слияния. Когда оно обязательно, запрещено или допустимо, разбирается в уроке 16. Видео урока: <a href="https://www.youtube.com/watch?v=RaPTODPTRb8" target="_blank" rel="noopener noreferrer">урок 15</a>.</p>`,
  wk: [
    { w: 'مَدَدَ', ru: 'протянул: исходное строение', res: 'مَدَّ', steps: [
      { q: 'Какие корневые повторяются?', a: 'Вторая и третья: د и د. Это مُضَاعَفٌ ثُلَاثِيٌّ.', tg: 'م د د' },
      { q: 'Что сделать с первой د?', a: 'Убрать фатху: первая из двух одинаковых становится безгласной.', tg: 'مَدْدَ' },
      { q: 'Как записать دْ + دَ?', a: 'Одна د с шаддой и фатхой. Первая د — مُدْغَمٌ, вторая — مُدْغَمٌ فِيهِ.', tg: 'مَدَّ' }] },
    { w: 'يَمْدُدُ', ru: 'протягивает: исходное строение', res: 'يَمُدُّ', steps: [
      { q: 'Что стоит перед парой د د?', a: 'مْ — безгласная буква. Сначала переносим на неё дамму первой د.', tg: 'يَمْدُدُ' },
      { q: 'Перенесите дамму с первой د на م', a: 'م получает дамму, первая د — сукун.', tg: 'يَمُدْدُ' },
      { q: 'Слейте соседние دْ + دُ', a: 'Получается دُّ. Конечная дамма сохраняется.', tg: 'يَمُدُّ' }] },
    { w: 'زَلْزَلَ', ru: 'сотряс', self: true, res: 'مُضَاعَفٌ رُبَاعِيٌّ', steps: [
      { q: 'Какие буквы корневые?', o: ['ز ل ز ل', 'ز ل ل'], ans: 0, a: 'Все четыре корневые; добавочных букв нет.', tg: 'ز ل ز ل' },
      { q: 'Как повторяются корневые?', o: ['1-я = 3-я; 2-я = 4-я', '2-я = 3-я'], ans: 0, a: 'Повторяется пара ز ل: это مُضَاعَفٌ رُبَاعِيٌّ, также الْمُطَابِقُ.', tg: 'ز ل · ز ل' },
      { q: 'Нужно ли сливать буквы в زَلْزَلَ?', o: ['нет: одинаковые буквы не соседние', 'да: любое повторение требует шадды'], ans: 0, a: 'Между двумя ز стоит ل, между двумя ل — ز. Для слияния нужны соседние одинаковые согласные.', tg: 'زَلْزَلَ' }] },
  ] },
/* ---------- 16: основной текст с фотографий учебника ---------- */
{ n: 16, ar: 'أَحْكَامُ الْإِدْغَامِ', ru: 'Правила слияния: обязательно, запрещено, допустимо', short: 'Три случая слияния', min: 25,
  text: [
    { src: `وَالْإِدْغَامُ ${T('wajib', 'وَاجِبٌ')} فِي نَحْوِ مَدَّ يَمُدُّ وَأَعَدَّ يُعِدُّ وَانْقَدَّ يَنْقَدُّ وَاعْتَدَّ يَعْتَدُّ وَاسْوَدَّ يَسْوَدُّ وَاسْوَادَّ يَسْوَادُّ وَاسْتَعَدَّ يَسْتَعِدُّ وَاطْمَأَنَّ يَطْمَئِنُّ وَتَمَادَّ يَتَمَادُّ، وَكَذَا هَذِهِ الْأَفْعَالُ إِذَا بَنَيْتَهَا لِلْمَفْعُولِ نَحْوُ مُدَّ يُمَدُّ وَقِسْ عَلَى هَذَا نَظَائِرَهُ، وَفِي مَدٍّ مَصْدَرًا، وَكَذَلِكَ إِذَا اتَّصَلَ بِالْفِعْلِ أَلِفُ الضَّمِيرِ أَوْ وَاوُهُ أَوْ يَاؤُهُ نَحْوُ مَدَّا مَدُّوا مُدِّي.`,
      tr: 'Слияние обязательно в таких словах, как مَدَّ يَمُدُّ «протянул — протягивает», أَعَدَّ يُعِدُّ «подготовил — готовит», اِنْقَدَّ يَنْقَدُّ «разорвался — разрывается», اِعْتَدَّ يَعْتَدُّ «принял в расчёт — принимает в расчёт», اِسْوَدَّ يَسْوَدُّ «почернел — чернеет», اِسْوَادَّ يَسْوَادُّ «сильно почернел — сильно чернеет», اِسْتَعَدَّ يَسْتَعِدُّ «приготовился — готовится», اِطْمَأَنَّ يَطْمَئِنُّ «успокоился — успокаивается», تَمَادَّ يَتَمَادُّ «тянули — тянут друг у друга». Так же — когда эти глаголы ставишь в страдательный залог: مُدَّ يُمَدُّ «его протянули — его протягивают»; остальные подобные строй по этому образцу. Так же — в слове مَدٌّ «протягивание», когда это масдар. И так же — когда к глаголу присоединён алиф местоимения, его вав или его йа: مَدَّا «они двое протянули», مَدُّوا «они протянули», مُدِّي «протяни» (женщине).',
      gl: [['وَاجِبٌ', 'обязателен'], ['فِي نَحْوِ', 'в таких словах, как…'], ['إِذَا بَنَيْتَهَا لِلْمَفْعُولِ', 'когда строишь их для страдательного залога'], ['قِسْ عَلَى هَذَا نَظَائِرَهُ', 'подобные ему строй по этому образцу'], ['مَصْدَرًا', 'когда оно — масдар'], ['أَلِفُ الضَّمِيرِ', 'алиф-местоимение «они двое, вы двое»'], ['وَاوُهُ · يَاؤُهُ', 'вав-местоимение «они, вы» · йа-местоимение «ты» (ж.)']] },
    { src: `وَ${T('mumtani', 'مُمْتَنِعٌ')} فِي نَحْوِ مَدَدْتُ مَدَدْنَا وَمَدَدْتَ إِلَى مَدَدْتُنَّ وَمَدَدْنَ وَيَمْدُدْنَ وَتَمْدُدْنَ وَامْدُدْنَ وَلَا تَمْدُدْنَ وَلَا يَمْدُدْنَ.`,

/* ---------- 16: генератор форм глагола с удвоенной последней коренной ---------- */
/* mi/ui/ai — основа со слиянием (кончается шаддой); mf/uf/af — основа без слияния (без конечной огласовки). */
const DSING = [0, 3, 6, 12, 13];
const dPfx = (stem, k) => PFX[k] + stem.slice(1);
const dM = v => k => k < 5 ? v.mi + ['َ', 'َا', 'ُوا', 'َتْ', 'َتَا'][k] : ASSIM(v.mf + MADI_E[k]);
/* fk — раскрыть слияние в пяти формах без окончания; hv — огласовка конца при слиянии в джазме */
const dU = (v, m = 'u', pre = '', only = null, fk = false, hv = 'َ') => k => {
  if (only && !only.includes(k)) return null;
  if (k === 5 || k === 11) return pre + dPfx(v.uf, k) + 'ْنَ';
  if (m === 'j' && DSING.includes(k)) return pre + (fk ? dPfx(v.uf, k) + 'ْ' : dPfx(v.ui, k) + hv);
  return pre + dPfx(v.ui, k) + UE[m][k];
};
const dA = (v, fk = false, hv = 'َ') => k => k < 6 || k > 11 ? null : k === 11 ? v.af + 'ْنَ' : k === 6 ? (fk ? v.af + 'ْ' : v.ai + hv) : v.ai + AMR_E.a[k - 6];
const DV = {
  add: { mi: 'عَدّ', mf: 'عَدَد', ui: 'يَعُدّ', uf: 'يَعْدُد', ai: 'عُدّ', af: 'اُعْدُد' },
  madd: { mi: 'مَدّ', mf: 'مَدَد', ui: 'يَمُدّ', uf: 'يَمْدُد', ai: 'مُدّ', af: 'اُمْدُد' },
  istamadd: { mi: 'اِسْتَمَدّ', mf: 'اِسْتَمْدَد', ui: 'يَسْتَمِدّ', uf: 'يَسْتَمْدِد', ai: 'اِسْتَمِدّ', af: 'اِسْتَمْدِد' },
  insadd: { mi: 'اِنْسَدّ', mf: 'اِنْسَدَد', ui: 'يَنْسَدّ', uf: 'يَنْسَدِد', ai: 'اِنْسَدّ', af: 'اِنْسَدِد' },
  iswadd: { mi: 'اِسْوَدّ', mf: 'اِسْوَدَد', ui: 'يَسْوَدّ', uf: 'يَسْوَدِد', ai: 'اِسْوَدّ', af: 'اِسْوَدِد' },
  ihmarr: { mi: 'اِحْمَرّ', mf: 'اِحْمَرَر', ui: 'يَحْمَرّ', uf: 'يَحْمَرِر', ai: 'اِحْمَرّ', af: 'اِحْمَرِر' },
};
const dFull = v => [{ h: 'الْمَاضِي', f: dM(v) }, { h: 'الْمُضَارِعُ', f: dU(v) }, { h: 'الْأَمْرُ', f: dA(v), g: 'amr' }];

    ]) + `<p class="note">Серым под словом — страдательный залог. Значения: ${a('مَدَّ')} «протянул», ${a('مَدَّدَ')} «растянул», ${a('مَادَّ')} «тянул вместе с кем-то; дал отсрочку», ${a('أَمَدَّ')} «снабдил, поддержал», ${a('تَمَدَّدَ')} «растянулся», ${a('تَمَادَّ')} «тянули друг у друга», ${a('اِمْتَدَّ')} «простёрся», ${a('اِسْتَمَدَّ')} «попросил поддержки». Для ${a('اِنْفَعَلَ')} учебник берёт другой корень: ${a('اِنْصَبَّ')} «вылился». Строка ${a('اِفْعَلَّ')} в учебнике пустая: этот вес — для цветов и телесных признаков (${a('اِحْمَرَّ')}).</p>

    { h: 'Примечания учебника: обязательное слияние', html: () => `
      <p class="ar src" lang="ar" dir="rtl">لِلْإِدْغَامِ ثَلَاثَةُ أَحْوَالٍ: الْوُجُوبُ، الِامْتِنَاعُ، الْجَوَازُ.</p>
